name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**", "ci/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - name: selftest (installed package, no network, no credentials)
        run: energy-analyzer selftest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history: the history becomes public with the repo
      - name: gitleaks (full history)
        run: bash scripts/gitleaks.sh history
      - name: generic author-data scan (full history and tree)
        run: bash scripts/secret_scan.sh --history && bash scripts/secret_scan.sh --tree

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t energy-analyzer:ci .
      - run: docker run --rm energy-analyzer:ci selftest
