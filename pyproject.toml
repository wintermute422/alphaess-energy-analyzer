[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaess-energy-analyzer"
version = "0.2.0"
description = "Pull AlphaESS Open API data into SQLite, analyze standby load, self-sufficiency and anomalies, and write an offline HTML report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "AlphaESS Energy Analyzer contributors" }]
keywords = ["alphaess", "solar", "battery", "energy", "sqlite", "report"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "tomli>=2.0"]

[project.scripts]
energy-analyzer = "energy_analyzer.cli:main"

[project.urls]
Source = "https://github.com/wintermute422/alphaess-energy-analyzer"
Issues = "https://github.com/wintermute422/alphaess-energy-analyzer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
energy_analyzer = ["py.typed", "web/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
